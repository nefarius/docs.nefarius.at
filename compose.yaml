services:
  zensical:
    image: zensical/zensical:0.1.3
    ports:
      - "127.0.0.1:${ZENSICAL_PORT:-8000}:8000"
    volumes:
      - .:/docs
      - zensical-site:/docs/site
      - zensical-cache:/docs/.cache
      - zensical-state:/docs/.zensical

volumes:
  zensical-site:
  zensical-cache:
  zensical-state:
