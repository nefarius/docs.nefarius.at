services:
  material:
    build: .
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${MATERIAL_PORT:-8000}:8000"
    volumes:
      - .:/docs
      - material-site:/docs/site
      - material-cache:/docs/.cache

  zensical:
    image: zensical/zensical:0.1.0
    ports:
      - "127.0.0.1:${ZENSICAL_PORT:-8001}:8000"
    volumes:
      - .:/docs
      - zensical-site:/docs/site
      - zensical-cache:/docs/.cache
      - zensical-state:/docs/.zensical

volumes:
  material-site:
  material-cache:
  zensical-site:
  zensical-cache:
  zensical-state:
